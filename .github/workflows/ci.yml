name: Inference image checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Free hosted runner space for the vLLM image
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          docker system prune --all --force --volumes
          df -h /
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check syntax
        run: |
          python -m compileall -q scripts deployments/qwen-bf16
          bash -n scripts/start-server.sh
          bash -n deployments/qwen-bf16/bootstrap.sh
          python deployments/qwen-bf16/test_prepare_model.py
          python scripts/test_deploy_runpod.py
          python scripts/test_benchmark_chat.py
      - name: Build inference image
        run: docker build --platform linux/amd64 -t inference-ci .
      - name: Run tests in image without a GPU
        run: |
          set -euo pipefail
          for test in test_metrics_relay.py test_chat_gateway.py test_go_gateway_contract.py test_start_server.py test_start_jupyter.py test_lora_adapter.py; do
            docker run --rm --entrypoint python3 --tmpfs /workspace -v "$PWD/scripts:/tests:ro" inference-ci "/tests/$test"
          done
          for test in test_benchmark_capacity.py test_combined_capacity.py; do
            docker run --rm --entrypoint python3 --tmpfs /workspace -v "$PWD:/repo:ro" inference-ci "/repo/scripts/$test"
          done
