name: Deploy or roll back Runpod image
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'GitHub environment containing the intended Pod configuration'
        type: environment
        required: true
      image:
        description: 'Image digest: zihan000/qwen-inference@sha256:...'
        type: string
        required: true
      model_profile:
        description: 'Serving profile configured on the target Pod'
        type: choice
        options: [4bit, bf16]
        default: 4bit
      first_official_release:
        description: 'BF16 only: keep enabled until its first official image passes verification'
        type: boolean
        default: false
      max_num_seqs:
        description: 'Optional MAX_NUM_SEQS override: 1 or 2 (empty preserves current environment)'
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: runpod-inference-${{ inputs.target }}
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Deploy and verify, restoring the previous image on failure
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_CHAT_TOKEN: ${{ secrets.RUNPOD_CHAT_TOKEN }}
          RUNPOD_BF16_CHAT_TOKEN: ${{ secrets.RUNPOD_BF16_CHAT_TOKEN }}
          RUNPOD_BF16_POD_ID: ${{ vars.RUNPOD_BF16_POD_ID }}
          RUNPOD_POD_ID: ${{ vars.RUNPOD_POD_ID }}
          DEPLOY_IMAGE: ${{ inputs.image }}
          DEPLOY_MODEL_PROFILE: ${{ inputs.model_profile }}
          DEPLOY_FIRST_OFFICIAL_RELEASE: ${{ inputs.first_official_release }}
          DEPLOY_MAX_NUM_SEQS: ${{ inputs.max_num_seqs }}
        run: python scripts/deploy-runpod.py
      - name: Check metrics separately
        continue-on-error: true
        env:
          RUNPOD_METRICS_TOKEN: ${{ secrets.RUNPOD_METRICS_TOKEN }}
          RUNPOD_POD_ID: ${{ vars.RUNPOD_POD_ID }}
          MODEL_PROFILE: ${{ inputs.model_profile }}
          RUNPOD_BF16_POD_ID: ${{ vars.RUNPOD_BF16_POD_ID }}
        run: |
          metrics_port=8888
          if [[ "$MODEL_PROFILE" == bf16 ]]; then
            [[ -n "$RUNPOD_BF16_POD_ID" ]] || { echo "BF16 Pod is not configured."; exit 1; }
            RUNPOD_POD_ID="$RUNPOD_BF16_POD_ID"
            metrics_port=8889
          fi
          if [[ -z "$RUNPOD_METRICS_TOKEN" ]]; then
            echo 'Metrics token not configured; metrics check skipped.' >> "$GITHUB_STEP_SUMMARY"
          elif ! RUNPOD_METRICS_URL="https://${RUNPOD_POD_ID}-${metrics_port}.proxy.runpod.net" python scripts/check-monitoring.py; then
            echo 'Metrics check failed; inspect monitoring separately. Deployment was not rolled back.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo 'Metrics relay check passed.' >> "$GITHUB_STEP_SUMMARY"
          fi
